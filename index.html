<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Gesetzessammlung Web-App - eine Fassung für GitHub (iPhone/iPad) und das Windows-Programm (WebView2) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gesetze">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <!-- Bilder von gesetze-im-internet.de ohne Herkunftsangabe laden -->
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <title>Gesetzessammlung</title>
  <!-- Außerhalb von GitHub (Windows-Programm, gleich unter welcher Adresse) app.css/app.js immer frisch laden
       (WebView2 hält sonst alte Fassungen); auf GitHub übernimmt das der Service Worker -->
  <script>
    const FreshStamp = location.hostname.endsWith("github.io") ? "" : "?" + Date.now();
    document.write('<link rel="stylesheet" href="app.css' + FreshStamp + '">');
  </script>
  <!-- Stylesheet für das Mini-HTML: kommt aus der Datendatei (LawHtml.Css) -->
  <style id="LawCss"></style>
</head>
<body>

  <!-- Oben: Suchzeile (immer sichtbar) -->
  <header id="SearchBar">
    <button id="BackButton" class="BarButton" type="button" title="Zurück zur Liste">‹</button>
    <input id="SearchBox" type="search" placeholder="baugb 35, § 35 BauGB, außenbereich"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button id="PreviousButton" class="BarButton" type="button" title="Vorherige Vorschrift">▲</button>
    <button id="NextButton" class="BarButton" type="button" title="Nächste Vorschrift">▼</button>
    <button id="LayoutButton" class="BarButton" type="button" title="Einspaltig / zweispaltig">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path id="LayoutDivider" d="M9 4v16"/>
      </svg>
    </button>
    <button id="MenuButton" class="BarButton" type="button" title="Datenbank laden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>
      </svg>
    </button>
  </header>

  <main id="MainArea">

    <!-- Links (iPad) bzw. erste Ansicht (iPhone): Ergebnisliste -->
    <section id="ListPane">
      <div id="ListInfo"></div>
      <div id="ResultList" tabindex="0"></div>
    </section>

    <!-- Rechts (iPad) bzw. zweite Ansicht (iPhone): Vorschrift -->
    <section id="DetailPane">
      <div id="DetailHeader">
        <div id="DetailTitle"></div>
        <div id="DetailLaw"></div>
      </div>
      <div id="DetailScroll">
        <div id="LawBody"></div>
      </div>
    </section>

  </main>

  <!-- Datenbank laden / Info -->
  <div id="MenuPanel" hidden>
    <div id="MenuBox">
      <h2>Datenbank</h2>
      <p id="DataInfo">Noch keine Daten geladen.</p>
      <p class="Hint LocalOnly">Wird beim Start automatisch geladen von:<br><span id="DataPath"></span></p>
      <button id="ReloadButton" type="button" class="BigButton LocalOnly">Datenbank neu laden</button>
      <label id="LoadLabel" class="BigButton">
        <span class="WebOnly">Datenbank laden …</span><span class="LocalOnly">Andere Datei laden …</span>
        <input id="FileInput" type="file" hidden>
      </label>
      <p class="Hint LocalOnly">Eine andere Datei gilt nur bis zum nächsten Start.</p>
      <p class="Hint WebOnly">Datei <b>Gesetzessammlung_Web.json.gz</b> auswählen (z.B. aus iCloud Drive oder OneDrive).
        Die Daten werden nur auf diesem Gerät gespeichert.</p>
      <p class="Hint" id="AppVersion"></p>
      <button id="CloseMenuButton" type="button" class="BigButton Secondary">Schließen</button>
    </div>
  </div>

  <script>document.write('<script src="app.js' + FreshStamp + '"><\/script>');</script>
</body>
</html>
